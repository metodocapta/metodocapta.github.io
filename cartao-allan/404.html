<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Método Capta+</title>
<link rel="icon" href="assets/favicon.png">
<style>
:root{--bg:#020d0d;--ink:#eff9f6;--muted:#a7bbb6;--teal:#19d3c5}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;background:radial-gradient(120% 60% at 50% 20%,#0a3b38,#041817 45%,var(--bg));color:var(--ink);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:grid;place-items:center;text-align:center;padding:24px}
.box{max-width:420px}
.cod{font-size:76px;font-weight:900;letter-spacing:-2px;
  background:linear-gradient(160deg,#6ff5f1,#19d3c5 50%,#0a9f97);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:22px;font-weight:800;margin:10px 0 8px}
p{color:var(--muted);font-size:14px;line-height:1.6}
a{display:inline-block;margin-top:20px;background:var(--teal);color:#02110f;text-decoration:none;font-weight:800;
  padding:12px 24px;border-radius:30px;font-size:14px}
</style>
</head>
<body>
  <div class="box">
    <div class="cod">404</div>
    <h1>Esse cartão não existe (ou mudou de endereço).</h1>
    <p>A página que você procurou não está aqui. Volte para o cartão principal.</p>
    <a href="./">Ir para o cartão</a>
  </div>
</body>
</html>
