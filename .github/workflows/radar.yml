name: Atualizar Radar (paginas por mecanismo)

# Regenera as paginas publicas do Radar (/radar/ + /radar/<mecanismo>/) e o
# sitemap.xml/llms.txt a partir de assets/radar_snapshot.json (dado agregado).
#
# Roda: quando o snapshot muda, no botao manual e diariamente.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/radar_snapshot.json"
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerar as paginas do Radar
        run: python3 tools/radar_paginas.py --site .

      - name: Commit se houver mudanca
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar sitemap.xml llms.txt
          if git diff --staged --quiet; then
            echo "Sem mudancas no Radar."
          else
            git commit -m "chore(radar): regenera as paginas por mecanismo"
            git push
            echo "Radar atualizado."
          fi
