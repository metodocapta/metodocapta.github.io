name: Verificar invariantes do site

# Portao de saida CONTINUO: roda a cada push no repositorio publicado e FALHA se
# alguma invariante sumir - identidade (Missao/Visao/Valores), menu fixo (sticky),
# imagens leves, componente Capta+ T-Intelligence (sem codigo de modulo, sem "IA",
# sem JS), camadas decorativas sem clique morto, camadas do metodo x dado,
# cobertura do mapa do site e assets self-hosted.
#
# O antigo radar.yml REGERAVA as paginas do Radar por fora do rebrand e commitava:
# as 9 paginas ficavam sem marca-capta.css/movimento.css/fm-eventos (sem a camada
# de marca) ate o publish seguinte. O Radar ja e gerado no build (passo 1b, JA com
# o rebrand). Por isso a regeneracao saiu do CI e o cron diario vive AQUI, que nao
# escreve nada - so verifica.
#
# As regras moram em .github/verificar_repo.py, que roda igual na sua maquina:
#   python .github/verificar_repo.py --raiz .
# (na fonte: python MARKETING/SITE_METODO_CAPTA/.github/verificar_repo.py \
#    --raiz MARKETING/SITE_METODO_CAPTA)
#
# A fonte e a verdade: FOMENTIA\MARKETING\SITE_METODO_CAPTA
# (ver LEIA-ME_EDICAO_DO_SITE.md)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"        # diario: pega regressao sem depender de push

permissions:
  contents: read

jobs:
  invariantes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir as invariantes do site
        run: python3 .github/verificar_repo.py --raiz .
