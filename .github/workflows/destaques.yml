name: Atualizar Destaques (Substack)

# Puxa os ultimos 5 posts do Substack e atualiza assets/destaques.json,
# que alimenta o slider "Destaques" da Home.
#
# Roda: de hora em hora, no botao manual e quando um estudo novo for publicado.
#
# FONTES (em ordem, com fallback): rss2json e feed2json fazem a busca nos
# servidores DELES, entao funcionam mesmo com o IP do runner do GitHub
# bloqueado pelo Cloudflare do Substack. O acesso direto e os proxies antigos
# seguem como ultimo recurso. As tres fontes produzem o MESMO JSON.

on:
  schedule:
    - cron: "0 * * * *"        # de hora em hora (post novo aparece em ate ~1h)
  workflow_dispatch:            # permite rodar manualmente na aba Actions
  push:
    branches: [main]
    paths:
      - "estudos/**"            # publicou estudo novo -> atualiza os destaques
      - "assets/destaques.json"

permissions:
  contents: write

concurrency:
  group: destaques
  cancel-in-progress: true

jobs:
  destaques:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Coletar o feed do Substack
        run: |
          python3 - <<'PY'
          import email.utils, html, json, re, time, urllib.error, urllib.parse, urllib.request
          from datetime import date

          FEED  = "https://minutocaptamais.substack.com/feed"
          SAIDA = "assets/destaques.json"
          LIMITE = 5
          MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"]
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36")
          RESUMO_MAX = 130
          RESUMO_MIN = 59
          _BOILER = re.compile(
              r"^(compartilh|share|assine|inscreva|leia|foto|imagem|cr[\u00e9e]dito|publicad|"
              r"por\s+|reportagem|edi[\u00e7c][\u00e3a]o|newsletter|obrigad|apoio|patroc|realiza|este post)",
              re.I)

          # Curadoria de titulos-gancho (mesmo arquivo que o builder local usa).
          try:
              with open("assets/titulos_gancho.json", encoding="utf-8") as fh:
                  TITULOS = {k: v for k, v in json.load(fh).items() if not k.startswith("_")}
          except (OSError, ValueError):
              TITULOS = {}

          def texto(bruto, limite=None):
              s = re.sub(r"<(script|style)\b[\s\S]*?</\1>", " ", bruto or "", flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              s = " ".join(html.unescape(s).split())
              if limite and len(s) > limite:
                  s = (s[:limite].rsplit(" ", 1)[0] or s[:limite]).rstrip(",.;:") + "\u2026"
              return s

          def titulo_estrategico(slug, lead):
              if slug in TITULOS:
                  return TITULOS[slug]
              s = lead or ""
              if "\u2014" in s:
                  s = s.rsplit("\u2014", 1)[1]
              s = re.sub(r"^\s*ESTRAT[\u00c9E]GIA DE CAPTA[\u00c7C][\u00c3A]O"
                         r"(\s+DE\s+RECURSOS)?\s*\d{0,2}[A-Z]?\d?\s*[-\u2013\u2014:.]?\s*",
                         "", s, flags=re.I)
              s = re.sub(r"^\s*NEWSLETTER[^:]*:\s*", "", s, flags=re.I)
              m = re.search(r"[\"\u201c]([^\"\u201c\u201d]{12,})[\"\u201d]", s)
              if m:
                  s = m.group(1)
              s = re.sub(r"[\"\u201c\u201d\u2018\u2019]", "", s)
              s = re.sub(r"\s+", " ", s).strip()
              frase = re.split(r"(?<=[.!?])\s", s)[0].strip(" -\u2013\u2014:;.")
              if len(frase) > 88:
                  frase = (frase[:88].rsplit(" ", 1)[0] or frase[:88]).rstrip(",.;:")
              return frase or "Estrat\u00e9gia de Capta\u00e7\u00e3o"

          def marca(s):
              s = re.sub(r"\bM\u00c9TODO CAPTA+\b", "M\u00c9TODO", s or "")
              s = re.sub(r"\bM\u00e9todo Capta+\b", "M\u00e9todo", s)
              return re.sub(r"\s+", " ", s).strip()

          def data_pt(pub):
              pub = (pub or "").strip()
              # rss2json: "2026-10-02 16:36:24"; jsonfeed: ISO 8601; RSS: RFC 2822.
              m = re.match(r"(\d{4})-(\d{2})-(\d{2})", pub)
              if m:
                  a, mo, d = (int(x) for x in m.groups())
                  return date(a, mo, d).isoformat(), "%02d %s %d" % (d, MESES[mo-1], a)
              try:
                  dt = email.utils.parsedate_to_datetime(pub)
                  return dt.date().isoformat(), "%02d %s %d" % (dt.day, MESES[dt.month-1], dt.year)
              except (TypeError, ValueError):
                  return "", ""

          def primeiro_paragrafo(enc, limite=RESUMO_MAX):
              if not enc:
                  return ""
              enc = re.sub(r"<(script|style)\b[\s\S]*?</\1>", " ", enc, flags=re.I)
              for p in re.findall(r"<p\b[^>]*>([\s\S]*?)</p>", enc, flags=re.I):
                  if re.search(r"<img\b", p, re.I):
                      continue
                  t = texto(p)
                  if len(t) < RESUMO_MIN or _BOILER.match(t):
                      continue
                  return texto(p, limite)
              return ""

          def imagem_leve(url, largura=640):
              if not url or "/image/fetch/" not in url:
                  return url
              pre, resto = url.split("/image/fetch/", 1)
              if "/" not in resto:
                  return url
              transf, origem = resto.split("/", 1)
              toks = [t for t in transf.split(",")
                      if t and not re.match(r"^w_\d+$", t) and t != "c_limit"]
              if "f_auto" in toks:
                  toks[toks.index("f_auto")] = "f_webp"
              elif "f_webp" not in toks:
                  toks.append("f_webp")
              toks.append("w_%d" % largura)
              if "://" in origem and "%3A" not in origem.upper() and "%2F" not in origem.upper():
                  origem = urllib.parse.quote(origem, safe="")
              return pre + "/image/fetch/" + ",".join(toks) + "/" + origem

          def baixar(url, tentativas=3):
              hdrs = {
                  "User-Agent": UA,
                  "Accept": "application/rss+xml, application/xml, text/xml, application/json, */*;q=0.8",
                  "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.7",
                  "Cache-Control": "no-cache",
              }
              erro = None
              for i in range(tentativas):
                  try:
                      return urllib.request.urlopen(
                          urllib.request.Request(url, headers=hdrs), timeout=45
                      ).read().decode("utf-8", "replace")
                  except (urllib.error.HTTPError, urllib.error.URLError, OSError) as exc:
                      erro = exc
                      if i < tentativas - 1:
                          time.sleep(5 * (i + 1))
              raise erro

          # ---- normaliza itens de RSS (XML), rss2json (JSON) e JSON Feed ----
          def itens_rss(bruto):
              import xml.etree.ElementTree as ET
              out = []
              for item in ET.fromstring(bruto).iter("item"):
                  img = ""
                  for el in item.iter():
                      tag = el.tag.split("}")[-1].lower()
                      u = el.get("url") or el.get("href")
                      if u and tag in ("content", "thumbnail", "enclosure") \
                         and re.search(r"\.(jpe?g|png|webp|gif)($|\?)", u, re.I):
                          img = u
                          break
                  enc = ""
                  for el in item.iter():
                      if el.tag.split("}")[-1].lower() == "encoded" and el.text:
                          enc = el.text
                          break
                  out.append({
                      "titulo": item.findtext("title") or "",
                      "link": (item.findtext("link") or "").strip(),
                      "pub": item.findtext("pubDate") or "",
                      "lead": item.findtext("description") or "",
                      "enc": enc,
                      "img": img,
                  })
              return out

          def itens_rss2json(bruto):
              out = []
              for it in json.loads(bruto).get("items", []):
                  enc = it.get("enclosure")
                  img = enc.get("link") if isinstance(enc, dict) else ""
                  out.append({
                      "titulo": it.get("title") or "",
                      "link": (it.get("link") or "").strip(),
                      "pub": it.get("pubDate") or "",
                      "lead": it.get("description") or "",
                      "enc": it.get("content") or "",
                      "img": img or it.get("thumbnail") or "",
                  })
              return out

          def itens_jsonfeed(bruto):
              out = []
              for it in json.loads(bruto).get("items", []):
                  conteudo = it.get("content_html") or ""
                  m = re.search(r'<img[^>]+src=["\']([^"\']+)["\']', conteudo, re.I)
                  img = it.get("image") or it.get("banner_image") or (m.group(1) if m else "")
                  out.append({
                      "titulo": it.get("title") or "",
                      "link": (it.get("url") or "").strip(),
                      "pub": it.get("date_published") or "",
                      "lead": it.get("summary") or "",
                      "enc": conteudo,
                      "img": img,
                  })
              return out

          def fontes():
              q = urllib.parse.quote(FEED, safe="")
              return [
                  ("rss2json", "https://api.rss2json.com/v1/api.json?rss_url=" + q),
                  ("jsonfeed", "https://feed2json.org/convert?url=" + q),
                  ("rss", FEED),
                  ("rss", "https://api.allorigins.win/raw?url=" + q),
                  ("rss", "https://api.codetabs.com/v1/proxy?quest=" + q),
                  ("rss", "https://corsproxy.io/?" + q),
              ]

          def pegar_itens():
              parsers = {"rss": itens_rss, "rss2json": itens_rss2json, "jsonfeed": itens_jsonfeed}
              for tipo, src in fontes():
                  try:
                      bruto = baixar(src)
                      if tipo == "rss" and "<item" not in bruto:
                          print("sem itens:", src[:70])
                          continue
                      if tipo in ("rss2json", "jsonfeed") and '"items"' not in bruto:
                          print("sem itens:", src[:70])
                          continue
                      itens = parsers[tipo](bruto)
                      if itens:
                          print("fonte OK:", tipo, "->", src[:60])
                          return itens
                      print("vazio:", src[:70])
                  except Exception as exc:
                      print("falhou:", src[:60], "->", exc)
              raise RuntimeError("nenhuma fonte retornou o feed do Substack")

          itens = []
          for c in pegar_itens():
              titulo = texto(c["titulo"])
              link = c["link"]
              if not titulo or not link:
                  continue
              iso, pt = data_pt(c["pub"])
              lead = marca(texto(c["lead"]))
              slug = link.rstrip("/").split("/")[-1]
              resumo = primeiro_paragrafo(c["enc"]) or texto(c["lead"], RESUMO_MAX)
              itens.append({
                  "titulo": marca(titulo),
                  "titulo_estrategico": marca(titulo_estrategico(slug, lead)),
                  "link": link,
                  "data": iso,
                  "data_pt": pt,
                  "resumo": marca(resumo),
                  "imagem": imagem_leve(c["img"]),
              })
              if len(itens) >= LIMITE:
                  break

          if not itens:
              raise RuntimeError("feed lido, mas sem itens validos")

          dado = {
              "gerado_em": date.today().isoformat(),
              "fonte": FEED,
              "publicacao": "M\u00e9todo Capta+ \u00b7 Substack",
              "itens": itens,
          }
          with open(SAIDA, "w", encoding="utf-8") as fh:
              json.dump(dado, fh, ensure_ascii=False, indent=1)
          print("itens coletados:", len(itens))
          for it in itens:
              print(" -", it["data_pt"], it["titulo"])
          PY

      - name: Commit se houver mudanca
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/destaques.json
          if git diff --staged --quiet; then
            echo "Sem mudancas nos destaques."
          else
            git commit -m "chore(destaques): atualiza o feed do Substack"
            git push
            echo "Destaques atualizados."
          fi
