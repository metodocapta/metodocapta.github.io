name: Atualizar Destaques (Substack)

# Puxa os ultimos 5 posts do Substack e atualiza assets/destaques.json,
# que alimenta o slider "Destaques" da Home.
#
# Roda: diariamente, no botao manual, e quando um estudo novo for publicado.

on:
  schedule:
    - cron: "0 9 * * *"        # diariamente, 09:00 UTC (06:00 em Brasilia)
  workflow_dispatch:            # permite rodar manualmente na aba Actions
  push:
    branches: [main]
    paths:
      - "estudos/**"            # publicou estudo novo -> atualiza os destaques
      - "assets/destaques.json"

permissions:
  contents: write

concurrency:
  group: destaques
  cancel-in-progress: true

jobs:
  destaques:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Coletar o feed do Substack
        run: |
          python3 - <<'PY'
          import email.utils, html, json, re, time, urllib.error, urllib.parse, urllib.request
          from datetime import date

          FEED  = "https://minutocaptamais.substack.com/feed"
          SAIDA = "assets/destaques.json"
          LIMITE = 5
          MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"]
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36")

          # Titulos-gancho: curadoria por slug (post novo cai na heuristica)
          TITULOS = {
              "newsletter-fomentia-capta-10092026": "Sua OSC N\u00e3o \u00c9 Uma Empresa \u2014 N\u00e3o A Gere Como Uma",
              "newsletter-fomentia-capta-07082026": "Habilita\u00e7\u00e3o N\u00e3o Se Resolve na V\u00e9spera do Edital",
              "newsletter-fomentia-capta-03092026": "De Cada R$ 10 Pedidos na LIR, S\u00f3 R$ 3 Chegam",
              "newsletter-fomentia-capta-01092026": "O Pente Que Separa a Pot\u00eancia da Car\u00eancia",
              "newsletter-fomentia-capta-31082026": "Projeto Gen\u00e9rico \u00c9 o Novo Lixo Institucional",
          }
          RESUMO_MAX = 130

          def titulo_estrategico(slug, lead):
              if slug in TITULOS:
                  return TITULOS[slug]
              s = re.sub(r"^\s*ESTRAT[\u00c9E]GIA DE CAPTA[\u00c7C][\u00c3A]O"
                         r"(\s+DE\s+RECURSOS)?\s*\d{0,2}[A-Z]?\d?\s*[-\u2013\u2014:.]?\s*",
                         "", lead or "", flags=re.I)
              s = re.sub(r"^\s*NEWSLETTER[^:]*:\s*", "", s, flags=re.I)
              frase = re.split(r"(?<=[.!?])\s", s.strip())[0].strip(" -\u2013\u2014:;.")
              if len(frase) > 88:
                  frase = (frase[:88].rsplit(" ", 1)[0] or frase[:88]).rstrip(",.;:")
              return frase or "Estrat\u00e9gia de Capta\u00e7\u00e3o"

          def texto(bruto, limite=None):
              s = re.sub(r"<(script|style)\b[\s\S]*?</\1>", " ", bruto or "", flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              s = " ".join(html.unescape(s).split())
              if limite and len(s) > limite:
                  s = (s[:limite].rsplit(" ", 1)[0] or s[:limite]).rstrip(",.;:") + "\u2026"
              return s

          def marca(s):
              s = re.sub(r"\bFOMENTIA\b", "M\u00c9TODO", s or "")
              s = re.sub(r"\bFomentia\b", "M\u00e9todo", s)
              return re.sub(r"\s+", " ", s).strip()

          def data_pt(pub):
              try:
                  dt = email.utils.parsedate_to_datetime(pub)
                  return dt.date().isoformat(), "%02d %s %d" % (dt.day, MESES[dt.month-1], dt.year)
              except (TypeError, ValueError):
                  return "", ""

          def imagem(item):
              for el in item.iter():
                  tag = el.tag.split("}")[-1].lower()
                  url = el.get("url") or el.get("href")
                  if url and tag in ("content", "thumbnail", "enclosure") \
                     and re.search(r"\.(jpe?g|png|webp|gif)($|\?)", url, re.I):
                      return url
              return ""

          def baixar(url, tentativas=3):
              hdrs = {
                  "User-Agent": UA,
                  "Accept": "application/rss+xml, application/xml, text/xml, */*;q=0.8",
                  "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.7",
                  "Cache-Control": "no-cache",
              }
              erro = None
              for i in range(tentativas):
                  try:
                      return urllib.request.urlopen(
                          urllib.request.Request(url, headers=hdrs), timeout=45
                      ).read().decode("utf-8", "replace")
                  except (urllib.error.HTTPError, urllib.error.URLError, OSError) as exc:
                      erro = exc
                      if i < tentativas - 1:
                          time.sleep(5 * (i + 1))
              raise erro

          # O Substack (Cloudflare) bloqueia o IP do runner do GitHub (HTTP 403).
          # Tenta direto e, se falhar, por proxies publicos de leitura que buscam
          # do IP deles — devolvendo o mesmo XML.
          FONTES = [
              FEED,
              "https://api.allorigins.win/raw?url=" + urllib.parse.quote(FEED, safe=""),
              "https://corsproxy.io/?" + urllib.parse.quote(FEED, safe=""),
              "https://api.codetabs.com/v1/proxy?quest=" + urllib.parse.quote(FEED, safe=""),
          ]

          def pegar_feed():
              for src in FONTES:
                  try:
                      bruto = baixar(src)
                      if "<item" in bruto:
                          print("fonte OK:", src[:74])
                          return bruto
                      print("sem itens:", src[:74])
                  except Exception as exc:
                      print("falhou:", src[:60], "->", exc)
              raise RuntimeError("nenhuma fonte retornou o feed do Substack")

          bruto = pegar_feed()

          import xml.etree.ElementTree as ET
          itens = []
          for item in ET.fromstring(bruto).iter("item"):
              titulo = texto(item.findtext("title"))
              link = (item.findtext("link") or "").strip()
              if not titulo or not link:
                  continue
              iso, pt = data_pt(item.findtext("pubDate"))
              lead = marca(texto(item.findtext("description")))
              slug = link.rstrip("/").split("/")[-1]
              itens.append({
                  "titulo": marca(titulo),
                  "titulo_estrategico": marca(titulo_estrategico(slug, lead)),
                  "link": link,
                  "data": iso,
                  "data_pt": pt,
                  "resumo": marca(texto(item.findtext("description"), RESUMO_MAX)),
                  "imagem": imagem(item),
              })
              if len(itens) >= LIMITE:
                  break

          dado = {
              "gerado_em": date.today().isoformat(),
              "fonte": FEED,
              "publicacao": "M\u00e9todo Capta+ \u00b7 Substack",
              "itens": itens,
          }
          with open(SAIDA, "w", encoding="utf-8") as fh:
              json.dump(dado, fh, ensure_ascii=False, indent=1)
          print("itens coletados:", len(itens))
          for it in itens:
              print(" -", it["data_pt"], it["titulo"])
          PY

      - name: Commit se houver mudanca
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/destaques.json
          if git diff --staged --quiet; then
            echo "Sem mudancas nos destaques."
          else
            git commit -m "chore(destaques): atualiza o feed do Substack"
            git push
            echo "Destaques atualizados."
          fi
